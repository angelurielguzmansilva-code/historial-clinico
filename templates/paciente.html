<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Expediente - {{ paciente.nombre }}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Expediente Clínico
            </h3>

        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-3">
                    <strong>ID:</strong>
                </div>

                <div class="col-md-9">
                    {{ paciente.id }}
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-3">
                    <strong>Nombre:</strong>
                </div>

                <div class="col-md-9">
                    {{ paciente.nombre }}
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-3">
                    <strong>Edad:</strong>
                </div>

                <div class="col-md-9">
                    {{ paciente.edad }} años
                </div>

            </div>

            <div class="row mb-4">

                <div class="col-md-3">
                    <strong>Diagnóstico:</strong>
                </div>

                <div class="col-md-9">

                    <span class="badge bg-info text-dark fs-6">
                        {{ paciente.diagnostico }}
                    </span>

                </div>

            </div>

            <hr>

            <div class="text-center">

                <a href="{{ url_for('index') }}"
                   class="btn btn-secondary">

                    Regresar

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
